description: Update the Profile API contract and synchronize profile consumers.

repos:
  - profile-api
  - profile-web
  - notification-worker

order:
  - profile-api
  - profile-web
  - notification-worker

repo_context:
  profile-api:
    branch: scenario/profile-display-name
    instruction_sources:
      - AGENTS.md
      - README.md
    key_files:
      - openapi.yaml
      - src/profile.js
  profile-web:
    branch: scenario/profile-display-name
    instruction_sources:
      - AGENTS.md
      - README.md
    key_files:
      - src/render-profile.js
  notification-worker:
    branch: scenario/profile-display-name
    instruction_sources:
      - AGENTS.md
      - README.md
    key_files:
      - src/email-template.js
