order:
  - contract-repo
  - consumer-repo
  - worker-repo

repos:
  contract-repo:
    path: ../profile-api
    role: contract-source
    description: Owns the source-of-truth contract and example implementation.
    outputs:
      - id: profile-client
        type: npm-package
        name: "@company/profile-client"
        description: Generated client package for profile API consumers.
    instruction_sources:
      - AGENTS.md
      - .trellis/workflow.md
      - CONTRIBUTING.md
      - README.md
    key_files:
      - src/contracts/
      - openapi.yaml
    checks:
      - npm run typecheck
      - npm test
  consumer-repo:
    path: ../profile-web
    role: downstream-ui
    description: Consumes generated contract clients in the product UI.
    depends_on:
      - repo: contract-repo
        output: profile-client
        reason: Uses the generated profile API client.
    instruction_sources:
      - AGENTS.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - README.md
    key_files:
      - src/api/
      - src/generated/
    checks:
      - npm run typecheck
      - npm test
  worker-repo:
    path: ../notification-worker
    role: async-consumer
    description: Consumes contract payloads in async notification flows.
    depends_on:
      - repo: contract-repo
        output: profile-client
        reason: Uses contract payload types for notification events.
    instruction_sources:
      - AGENTS.md
      - README.md
      - Makefile
    key_files:
      - workers/
      - events/
    checks:
      - npm run typecheck
      - npm test
