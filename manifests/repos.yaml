harness:
  # Use "standalone" when this directory is separate from all business repos.
  # Use "hosted" when this directory lives inside a primary business repo.
  placement: standalone
  root: $HARNESS_ROOT
  workspace_root: /absolute/path/to/workspace
  # host_repo is required only for hosted placement.
  # host_repo: contract-repo

repos:
  contract-repo:
    path: $WORKSPACE_ROOT/contract-repo
    role: contract-source
    description: Owns the shared contract, schema, or source-of-truth domain model.
    default_branch: main
    branch_prefix: scenario
    instruction_sources:
      - AGENTS.md
      - .trellis/workflow.md
      - CONTRIBUTING.md
      - README.md
    checks:
      - npm run lint
      - npm run typecheck
      - npm test
    key_files:
      - src/contracts/
      - openapi.yaml

  consumer-repo:
    path: $WORKSPACE_ROOT/consumer-repo
    role: downstream-consumer
    description: Consumes artifacts, APIs, events, or generated clients from the contract repository.
    default_branch: main
    branch_prefix: scenario
    instruction_sources:
      - AGENTS.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - README.md
    checks:
      - pnpm typecheck
      - pnpm test
    key_files:
      - src/api/
      - src/generated/

  worker-repo:
    path: $WORKSPACE_ROOT/worker-repo
    role: async-worker
    description: Processes events, jobs, or background workflows related to the scenario.
    default_branch: main
    branch_prefix: scenario
    instruction_sources:
      - AGENTS.md
      - README.md
      - Makefile
    checks:
      - make test
    key_files:
      - workers/
      - events/
