repos:
  profile-api:
    path: ../profile-api
    role: contract-source
    description: Owns the Profile API contract and example implementation.
    default_branch: main
    branch_prefix: scenario
    checks:
      - npm run typecheck
      - npm test

  profile-web:
    path: ../profile-web
    role: downstream-ui
    description: Renders profile data returned by the Profile API.
    default_branch: main
    branch_prefix: scenario
    checks:
      - npm run typecheck
      - npm test

  notification-worker:
    path: ../notification-worker
    role: async-consumer
    description: Builds notification copy from profile payloads.
    default_branch: main
    branch_prefix: scenario
    checks:
      - npm run typecheck
      - npm test
